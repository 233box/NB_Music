<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NB Music 桌面歌词</title>
  <link rel="stylesheet" href="styles/components/desktop-lyrics.css">
</head>
<body>
  <div id="lyrics-container">
    <div class="lyrics-content">
      <div class="current-line">NB Music 桌面歌词</div>
      <div class="translation-line"></div>
    </div>
  </div>

  <div class="heartbeat"></div>

  <script>
    const { ipcRenderer } = require('electron');

    const lyricsContent = document.querySelector('.lyrics-content');
    const curLineEl = document.querySelector('.current-line');
    const transLineEl = document.querySelector('.translation-line');
    let lastUpdateTime = Date.now();

    // 锁定状态（由主进程同步）：锁定=穿透不可拖；未锁定=可拖动、控制条跟随
    let isPinned = true;
    let dragging = false;

    ipcRenderer.on('desktop-lyrics-pin-state', (event, pinned) => {
      isPinned = !!pinned;
      document.body.classList.toggle('locked', isPinned);
    });

    // JS 自绘拖动（未锁定时）：拖歌词窗口，主进程同步控制条跟随
    document.addEventListener('mousedown', (e) => {
      if (isPinned || e.button !== 0) return;
      dragging = true;
      ipcRenderer.send('desktop-lyrics-drag-start');
    });
    document.addEventListener('mouseup', () => {
      if (dragging) { dragging = false; ipcRenderer.send('desktop-lyrics-drag-end'); }
    });
    document.addEventListener('mouseleave', () => {
      if (dragging) { dragging = false; ipcRenderer.send('desktop-lyrics-drag-end'); }
    });

    // 自检定时器：超过 10 秒无更新则请求同步
    setInterval(() => {
      const now = Date.now();
      if (now - lastUpdateTime > 10000) {
        ipcRenderer.send('force-sync-desktop-lyrics');
        lastUpdateTime = now;
      }
      // 心跳动画（调试用）
      document.querySelector('.heartbeat').style.opacity =
        (Math.sin(Date.now() / 500) + 1) / 4 + 0.25;
    }, 100);

    // 监听来自主窗口的歌词更新（仅当前行 + 翻译）
    ipcRenderer.on('update-desktop-lyrics', (event, data) => {
      const { currentLine, currentTranslation } = data;
      lastUpdateTime = Date.now();

      const newCur = currentLine || 'NB Music 桌面歌词';
      const newTrans = (currentTranslation || '').trim();

      // 仅当歌词文本真的变化时才更新
      if (curLineEl.textContent !== newCur) {
        curLineEl.textContent = newCur;
      }
      if (transLineEl.textContent !== newTrans) {
        transLineEl.textContent = newTrans;
      }
    });

    // 监听样式更新
    ipcRenderer.on('update-lyrics-style', (event, style) => {
      const root = document.documentElement;

      if (style.fontFamily) {
        root.style.setProperty('--font-family', style.fontFamily);
      }
      if (style.currentLineSize) {
        root.style.setProperty('--current-line-size', `${style.currentLineSize}px`);
      }
      if (style.nextLineSize) {
        root.style.setProperty('--next-line-size', `${style.nextLineSize}px`);
      }
      if (style.theme1 && style.theme2) {
        root.style.setProperty('--theme-1', style.theme1);
        root.style.setProperty('--theme-2', style.theme2);
      }
      if (style.backgroundColor) {
        document.body.style.backgroundColor = style.backgroundColor;
      }
      if (style.blurAmount) {
        root.style.setProperty('--blur-amount', `${style.blurAmount}px`);
      }
      if (style.desktopLyricsColor) {
        root.style.setProperty('--current-line-color', style.desktopLyricsColor);
      }
      if (style.desktopLyricsTranslationColor) {
        root.style.setProperty('--translation-line-color', style.desktopLyricsTranslationColor);
      }
    });

    // 通知主进程窗口已准备好
    window.addEventListener('DOMContentLoaded', () => {
      ipcRenderer.send('desktop-lyrics-ready');
      setTimeout(() => {
        ipcRenderer.send('force-sync-desktop-lyrics');
      }, 500);
    });
  </script>
</body>
</html>
